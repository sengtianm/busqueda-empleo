# --- Discovered sources (Module 1) ---
fuentes:
  - source_id: "linkedin"
    nombre: "LinkedIn"
    ficha_acceso:
      url: "https://www.linkedin.com/jobs/search"
      tipo_acceso: "con_autenticacion"
      credenciales_referencia:
        - "LINKEDIN_EMAIL"
        - "LINKEDIN_PASSWORD"
      criterio_exito: "global-nav"
      timeout_segundos: 30
    sets_de_filtros:
      - set_indice: 0
        filtros:
          - tipo: "keywords"
            valor: ["Data Engineer", "Analista de Datos", "Ingeniero de Datos"]
          - tipo: "ubicacion"
            valor: ""
          - tipo: "modalidad"
            valor: ""
    politicas_de_captura:
      max_paginas: 5
      max_ofertas_por_corrida: 25
      pausa_entre_lotes_segundos: 10
      estrategia_anti_bloqueo: "pausa_aleatoria"

# --- Capture defaults (Module 1, global) ---
captura:
  max_paginas: 5
  max_ofertas_por_corrida: 25
  pausa_entre_lotes_segundos: 10
  estrategia_anti_bloqueo: "pausa_aleatoria"

# --- Concurrency (Module 1, lock) ---
concurrencia:
  umbral_obsolescencia_minutos: 120

# --- Credential storage (D4) ---
almacen_credenciales:
  mecanismo: ".env"
  archivo: "config/.env"
  referencias:
    - "LINKEDIN_EMAIL"
    - "LINKEDIN_PASSWORD"

# --- Evaluation (DOC-03) ---
evaluation:
  high_compatibility_threshold: 80
  medium_compatibility_threshold: 50
  weights:
    experiencia: 0.30
    tecnologia: 0.25
    ubicacion: 0.15
    modalidad: 0.10
    idiomas: 0.10
    seniority: 0.10

# --- Browser ---
browser:
  headless: true
  timeout_seconds: 30
  profile_path: ""

# --- Local AI (Ollama) ---
ai_local:
  host: "localhost"
  port: 11434
  model: "qwen3.5:4b"
  timeout_seconds: 60

# --- AI Cloud (Ollama Cloud via local proxy) ---
ai_cloud:
  endpoint: "http://localhost:11434"
  model: "gemma4:31b-cloud"
  timeout_seconds: 120

# --- AI Routing by Purpose ---
ai_routing:
  evaluation: "cloud"
  processing: "cloud"

# --- Persistence ---
persistence:
  data_path: "data"
  db_file: "data/job_search.db"

# --- Logging ---
logging:
  level: "DEBUG"
  rotation: "10 MB"
  retention_days: 30

# --- Retries (DOC-06) ---
retries:
  max_attempts: 3
  base_wait_seconds: 2
  max_wait_seconds: 30
  multiplier: 2

# --- Professional Profile (DOC-10) ---
profile:
  tecnologias: {}
  experience_years: 0
  seniority: ""
  idiomas: {}
  ubicaciones_preferidas: []
  modalidades_preferidas: []
  salario_minimo: null
  empresas_objetivo: []
  empresas_excluidas: []
  educacion_nivel: ""
