# --- Discovered sources (Module 1) ---
fuentes:
  - fuente_id: "linkedin"
    nombre: "LinkedIn"
    ficha_acceso:
      enlace: "https://www.linkedin.com/jobs/search"
      tipo_acceso: "con_autenticacion"
      credenciales_referencia:
        - "LINKEDIN_EMAIL"
        - "LINKEDIN_PASSWORD"
      criterio_exito: "MainFeed"
      timeout_segundos: 30
    # Sets de filtros: una búsqueda por set; todos se ejecutan en la misma
    # corrida (set 0: buscar -> capturar -> registrar -> siguiente set).
    # Regla: indice_set debe ser consecutivo desde 0 (0, 1, 2, ...). Un hueco
    # (p.ej. 0 y 2) aborta la corrida con ERR-01 "Set ausente"; un índice
    # duplicado hace que el segundo set se ignore en silencio.
    sets_de_filtros:
      - indice_set: 0
        filtros:
          - tipo: "keywords"
            valor: ["Data Engineer"]
          - tipo: "ubicacion"
            valor: "Colombia"
          # Modalidad (D27): la UI nueva de LinkedIn solo soporta "remoto"
          # (f_SAL=f_SA_id_225001:272001); presencial/hibrido no son
          # representables (fallo filtros_no_aplicables). Para capturar
          # solo remoto, descomentar:
          # - tipo: "modalidad"
          #   valor: "remoto"
          - tipo: "fecha_publicacion"
            valor: "r86400"
    politicas_de_captura:
      max_paginas: 100
      max_ofertas_por_corrida: 1000
      pausa_entre_lotes_segundos: 5
      tope_espera_paginas_sucesivas_segundos: 10
      estrategia_anti_bloqueo: "pausa_aleatoria"

# --- Capture defaults (Module 1, global) ---
captura:
  max_paginas: 100
  max_ofertas_por_corrida: 1000
  pausa_entre_lotes_segundos: 5
  tope_espera_paginas_sucesivas_segundos: 10
  estrategia_anti_bloqueo: "pausa_aleatoria"

# --- Concurrency (Module 1, lock) ---
concurrencia:
  umbral_obsolescencia_minutos: 120

# --- Credential storage (D4) ---
almacen_credenciales:
  mecanismo: ".env"
  archivo: "config/.env"
  referencias:
    - "LINKEDIN_EMAIL"
    - "LINKEDIN_PASSWORD"

# --- Evaluation (DOC-03) ---
evaluation:
  high_compatibility_threshold: 80
  medium_compatibility_threshold: 50
  weights:
    experiencia: 0.30
    tecnologia: 0.25
    ubicacion: 0.15
    modalidad: 0.10
    idiomas: 0.10
    seniority: 0.10

# --- Browser ---
browser:
  headless: true
  timeout_seconds: 30
  profile_path: ""

# --- Local AI (Ollama) ---
ai_local:
  host: "localhost"
  port: 11434
  model: "qwen3.5:4b"
  timeout_seconds: 60

# --- AI Cloud (Ollama Cloud via local proxy) ---
ai_cloud:
  endpoint: "http://localhost:11434"
  model: "gemma4:31b-cloud"
  timeout_seconds: 120

# --- AI Routing by Purpose ---
ai_routing:
  evaluation: "cloud"
  processing: "cloud"

# --- Persistence ---
persistence:
  data_path: "data"
  db_file: "data/job_search.db"

# --- Logging ---
# Nivel por defecto INFO (corridas rutinarias); para depuración,
# LOG_LEVEL=DEBUG en .env (ver config/.env.template).
logging:
  level: "INFO"
  rotation: "10 MB"
  retention_days: 30
  logs_path: "logs"

# --- Retries (DOC-06) ---
retries:
  max_attempts: 3
  base_wait_seconds: 2
  max_wait_seconds: 30
  multiplier: 2

# --- Professional Profile (DOC-10) ---
profile:
  tecnologias: {}
  anos_experiencia: 0
  seniority: ""
  idiomas: {}
  ubicaciones_preferidas: []
  modalidades_preferidas: []
  salario_minimo: null
  empresas_objetivo: []
  empresas_excluidas: []
  educacion_nivel: ""
