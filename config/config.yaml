# --- Search ---
search:
  keywords:
    - Data Engineer
    - Analista de Datos
    - Ingeniero de Datos
  location: ""
  modality: ""
  max_pages: 5
  max_offers_per_page: 25

# --- Evaluation (DOC-03) ---
evaluation:
  high_compatibility_threshold: 80
  medium_compatibility_threshold: 50
  weights:
    experiencia: 0.30
    tecnologia: 0.25
    ubicacion: 0.15
    modalidad: 0.10
    idiomas: 0.10
    seniority: 0.10

# --- Browser ---
browser:
  headless: true
  timeout_seconds: 30
  profile_path: ""

# --- Local AI (Ollama) ---
ai_local:
  host: "localhost"
  port: 11434
  model: "qwen3.5:4b"
  timeout_seconds: 60

# --- AI Cloud (Ollama Cloud via local proxy) ---
ai_cloud:
  endpoint: "http://localhost:11434"
  model: "gemma4:31b-cloud"
  timeout_seconds: 120

# --- AI Routing by Purpose ---
ai_routing:
  evaluation: "cloud"
  processing: "cloud"

# --- Persistence ---
persistence:
  data_path: "data"
  db_file: "data/job_search.db"

# --- Logging ---
logging:
  level: "DEBUG"
  rotation: "10 MB"
  retention_days: 30

# --- Retries (DOC-06) ---
retries:
  max_attempts: 3
  base_wait_seconds: 2
  max_wait_seconds: 30
  multiplier: 2

# --- Professional Profile (DOC-10) ---
profile:
  tecnologias: {}
  experience_years: 0
  seniority: ""
  idiomas: {}
  ubicaciones_preferidas: []
  modalidades_preferidas: []
  salario_minimo: null
  empresas_objetivo: []
  empresas_excluidas: []
  educacion_nivel: ""
