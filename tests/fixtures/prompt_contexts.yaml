# Contextos de prueba para los 5 prompts (PRM-001 a PRM-005)
# Cada clave es el nombre de la variable que usa el prompt.


oferta_ejemplo:
  titulo_limpio: "Data Engineer Senior"
  descripcion_limpia: >
    Buscamos un Data Engineer Senior para unirse a nuestro equipo de datos
    en una empresa tecnológica líder del sector financiero. Será responsable
    de diseñar, construir y mantener pipelines de datos escalables, optimizar
    flujos ETL y colaborar con los equipos de data science e ingeniería.
    Trabajará con tecnologías cloud (AWS), Python, Spark y SQL. Valoramos
    experiencia con streaming con Kafka e infraestructura como código con
    Terraform. Ofrecemos 100% trabajo remoto, horario flexible, presupuesto
    anual de formación, seguro médico y plan de acciones.
  salario_min: 65000
  salario_max: 85000
  moneda: "EUR"
  ubicacion_limpia: "Spain (Remote)"
  modalidad: "remoto"
  requisitos:
    - "5+ years of experience in data engineering"
    - "Advanced Python"
    - "Advanced SQL"
    - "Experience with Apache Spark"
    - "Experience with AWS (S3, Redshift, Glue, EMR)"
    - "Knowledge of Kafka"
    - "English B2 or higher"
  tecnologias:
    - "Python"
    - "SQL"
    - "Spark"
    - "AWS"
    - "Kafka"
    - "Terraform"
    - "Airflow"
  idiomas:
    - "English"
    - "Spanish"
  experiencia_anios: 5


