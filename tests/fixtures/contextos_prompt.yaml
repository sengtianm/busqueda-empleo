# Contextos de prueba para los 5 prompts (PRM-001 a PRM-005)
# Cada clave es el nombre de la variable que usa el prompt.


oferta_ejemplo:
  titulo_limpio: "Data Engineer Senior"
  descripcion_limpia: >
    We are looking for a Senior Data Engineer to join our data team at
    a leading technology company in the financial sector. You will be responsible
    for designing, building and maintaining scalable data pipelines, optimizing
    ETL flows and collaborating with data science and engineering teams.
    You will work with cloud technologies (AWS), Python, Spark and SQL. We value
    experience with Kafka streaming and infrastructure as code with Terraform.
    We offer 100% remote work, flexible hours, annual training budget,
    health insurance and stock plan.
  salario_min: 65000
  salario_max: 85000
  moneda: "EUR"
  ubicacion_limpia: "Spain (Remote)"
  modalidad: "remoto"
  requisitos:
    - "5+ years of experience in data engineering"
    - "Advanced Python"
    - "Advanced SQL"
    - "Experience with Apache Spark"
    - "Experience with AWS (S3, Redshift, Glue, EMR)"
    - "Knowledge of Kafka"
    - "English B2 or higher"
  tecnologias:
    - "Python"
    - "SQL"
    - "Spark"
    - "AWS"
    - "Kafka"
    - "Terraform"
    - "Airflow"
  idiomas:
    - "English"
    - "Spanish"
  experiencia_anios: 5


perfil_ejemplo:
  tecnologias:
    Python: 7
    SQL: 6
    Spark: 4
    AWS: 3
    Airflow: 2
    Docker: 4
    Git: 5
  experiencia_anios: 8
  idiomas:
    Spanish: "Native"
    English: "C1"
    Catalan: "B2"
  ubicaciones_preferidas:
    - "Madrid"
    - "Remote Spain"
  modalidades_preferidas:
    - "remote"
    - "hybrid"
  salario_minimo: 60000
  seniority: "senior"
  empresas_objetivo:
    - "FAANG"
    - "Bolsas y Mercados Espanoles"
    - "Fintech"
  empresas_excluidas:
    - "Consultora"
    - "Accenture"
  educacion_nivel: "bachelor"


estrategia_ejemplo:
  puntos_fuertes:
    - "8 years of experience vs 5 required, exceeds the requirement"
    - "Technical stack aligned: Python, SQL, Spark, AWS"
    - "Experience in financial sector (BME)"
    - "English level C1"
  brechas:
    - "Little experience with Kafka (basic knowledge)"
    - "No experience with Terraform"
  narrativa: >
    Data engineer with 8 years of experience in the financial sector,
    specialized in ETL pipelines with Python and Spark on AWS. Combines
    technical strength with financial domain knowledge, allowing
    understanding of both business and technology.
  argumentos_clave:
    - "Experience exceeds requirements"
    - "Stack aligned with the offer"
    - "Financial domain knowledge"


diagnostico_ejemplo:
  diagnostico: >
    The company is looking for a Senior Data Engineer with a strong technical
    profile to lead the construction of data infrastructure. The role
    combines pure engineering with architecture, requiring technical
    autonomy and cross-functional collaboration skills.
  requisitos_clave:
    - requisito: "Advanced Python"
      tipo: "mandatory"
    - requisito: "Advanced SQL"
      tipo: "mandatory"
    - requisito: "Apache Spark"
      tipo: "mandatory"
    - requisito: "AWS"
      tipo: "mandatory"
    - requisito: "Kafka"
      tipo: "preferred"
    - requisito: "Terraform"
      tipo: "preferred"
  competencias:
    tecnicas:
      - "Python"
      - "SQL"
      - "Spark"
      - "AWS"
      - "ETL"
      - "Kafka"
    blandas:
      - "Communication"
      - "Teamwork"
      - "Autonomy"
      - "Problem solving"
  responsabilidades:
    - "Design and build scalable data pipelines"
    - "Optimize existing ETL flows"
    - "Collaborate with data science and engineering"
    - "Maintain cloud infrastructure"
  beneficios:
    - "100% remote work"
    - "Flexible hours"
    - "Annual training budget"
    - "Health insurance"
    - "Stock plan"
  cultura_empresarial: >
    Technology company in the financial sector with a culture of innovation,
    autonomous work and horizontal collaboration. They value continuous
    learning and work-life balance.


plan_candidatura_ejemplo:
  puntos_fuertes:
    - "Previous financial experience"
    - "Complete technical stack"
    - "Advanced English level"
  brechas:
    - "Kafka: basic knowledge"
    - "Terraform: no experience"
  narrativa: >
    Senior data engineer with fintech background, combining technical
    excellence with financial business domain knowledge.
  estrategia_diferenciacion: >
    Highlight financial sector experience as a key differentiator
    compared to purely technical candidates.
  argumentos_clave_reclutador:
    - "Experience exceeds requirements"
    - "Financial domain knowledge"
    - "Availability to start within reasonable time"
  acciones_recomendadas:
    - "Review basic Kafka concepts"
    - "Prepare concrete examples of ETL pipelines on AWS"
    - "Research the company and its financial products"
